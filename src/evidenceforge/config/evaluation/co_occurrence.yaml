# co_occurrence.yaml — Tier B record-level fidelity rules
#
# Purpose: Checks that when a condition matches in a generated record,
#   required field constraints hold (e.g., network logon has valid IP).
#
# Depends on: format definitions in config/formats/ (field names must exist)
# Depended on by: evaluation engine (eforge eval)
#
# To add a new rule:
#   1. Add under the format name key (e.g., windows_event_security:)
#   2. Define condition: fields that must match for the rule to apply
#   3. Define checks: constraints that must hold when condition matches
#   4. Valid check types: not_equal, present, min_length, matches
#
# Full schema: see commands/eforge/references/config-evaluation.md

windows_event_security:
  - name: "Network logon (type 3) requires valid IP"
    condition:
      EventID: 4624
      LogonType: 3
      exclude:
        TargetUserName: "ANONYMOUS LOGON"
    checks:
      - field: IpAddress
        not_equal: "-"
      - field: IpAddress
        not_equal: ""

  - name: "Interactive logon (type 2) uses local workstation"
    condition:
      EventID: 4624
      LogonType: 2
    checks:
      - field: WorkstationName
        not_equal: ""

  - name: "Process creation has process name"
    condition:
      EventID: 4688
    checks:
      - field: NewProcessName
        min_length: 1

  - name: "Logoff must have a logon type"
    condition:
      EventID: 4634
    checks:
      - field: LogonType
        present: true

  - name: "Logon has valid SID"
    condition:
      EventID: 4624
    checks:
      - field: TargetUserSid
        not_equal: ""

  - name: "Failed logon has status code"
    condition:
      EventID: 4625
    checks:
      - field: Status
        present: true
      - field: TargetUserName
        min_length: 1

  - name: "Special privileges has privilege list"
    condition:
      EventID: 4672
    checks:
      - field: PrivilegeList
        min_length: 1

  - name: "Process termination has process name"
    condition:
      EventID: 4689
    checks:
      - field: ProcessName
        min_length: 1
      - field: ProcessId
        present: true

  - name: "Kerberos TGT has krbtgt service"
    condition:
      EventID: 4768
    checks:
      - field: ServiceName
        equals: "krbtgt"
      - field: IpAddress
        not_equal: "-"

  - name: "Kerberos service ticket has service name"
    condition:
      EventID: 4769
    checks:
      - field: ServiceName
        min_length: 1
      - field: IpAddress
        not_equal: "-"

  - name: "NTLM validation has workstation"
    condition:
      EventID: 4776
    checks:
      - field: Workstation
        min_length: 1
      - field: TargetUserName
        min_length: 1

  - name: "Kerberos preauth failure has status"
    condition:
      EventID: 4771
    checks:
      - field: Status
        present: true
      - field: TargetUserName
        min_length: 1

  - name: "WFP connection has direction"
    condition:
      EventID: 5156
    checks:
      - field: Direction
        in: ["%%14592", "%%14593"]
      - field: SourceAddress
        present: true
      - field: DestAddress
        present: true

  - name: "Explicit creds has target server"
    condition:
      EventID: 4648
    checks:
      - field: TargetServerName
        min_length: 1
      - field: TargetUserName
        min_length: 1

zeek_conn:
  - name: "Completed connection (SF) has duration"
    condition:
      conn_state: "SF"
    checks:
      - field: duration
        present: true

  - name: "Completed connection (SF) has byte counts"
    condition:
      conn_state: "SF"
    checks:
      - field: orig_bytes
        present: true
      - field: resp_bytes
        present: true

  - name: "Connection has valid protocol"
    condition: {}
    checks:
      - field: proto
        in: ["tcp", "udp", "icmp"]

  # Impossible combinations
  - name: "Completed TCP (SF) cannot have zero duration"
    condition:
      conn_state: "SF"
      proto: "tcp"
    checks:
      - field: duration
        not_equal: 0


ecar:
  # Process-owned eCAR records should carry source-native process/thread IDs.
  # Session rows and listenerless/failure FLOW rows may legitimately omit them.
  - name: "PROCESS records have pid"
    condition:
      object: "PROCESS"
    checks:
      - field: pid
        present: true

  - name: "PROCESS records have tid"
    condition:
      object: "PROCESS"
    checks:
      - field: tid
        present: true

  - name: "All records have objectID"
    condition: {}
    checks:
      - field: objectID
        present: true

  # PROCESS-specific
  - name: "PROCESS/CREATE has image_path"
    condition:
      object: "PROCESS"
      action: "CREATE"
    checks:
      - field: image_path
        present: true

  - name: "PROCESS/CREATE has ppid"
    condition:
      object: "PROCESS"
      action: "CREATE"
    checks:
      - field: ppid
        present: true

  - name: "PROCESS/CREATE has command_line"
    condition:
      object: "PROCESS"
      action: "CREATE"
    checks:
      - field: command_line
        present: true

  # THREAD-specific
  - name: "THREAD/REMOTE_CREATE has target info"
    condition:
      object: "THREAD"
      action: "REMOTE_CREATE"
    checks:
      - field: target_pid
        present: true
      - field: image_path
        present: true

  # PROCESS/OPEN-specific
  - name: "PROCESS/OPEN has source image"
    condition:
      object: "PROCESS"
      action: "OPEN"
    checks:
      - field: image_path
        present: true

  # FLOW-specific
  - name: "FLOW events have network fields"
    condition:
      object: "FLOW"
    checks:
      - field: src_ip
        present: true
      - field: dst_ip
        present: true

  # SERVICE-specific
  - name: "SERVICE/CREATE has service name"
    condition:
      object: "SERVICE"
      action: "CREATE"
    checks:
      - field: service_name
        present: true

  # USER_SESSION-specific
  - name: "USER_SESSION LOGIN has principal"
    condition:
      object: "USER_SESSION"
      action: "LOGIN"
    checks:
      - field: principal
        present: true

eslogger:
  # macOS Endpoint Security (ESF) records use a single flat `event_type`
  # integer as the record discriminator (unlike eCAR's `object`/`action`
  # pair) — it maps 1:1 to the ES event name nested under `event.<name>`.
  # See ESLoggerEmitter._ES_EVENT_TYPE_CODES for the authoritative mapping:
  #   9=exec  10=open  11=fork  12=close  13=create  15=exit  24=write
  #   26=rename  27=unlink  105=btm_launch_item_add  106=openssh_login
  #   107=openssh_logout  108=lw_session_lock  109=lw_session_unlock
  #   130=su  131=sudo
  #
  # Field paths below use dotted notation matching the nested JSON produced
  # by ESLoggerEmitter (see config/formats/eslogger.yaml's own dotted field
  # list), on the assumption that a future eslogger evaluation parser
  # flattens the record the way ZeekNdjsonParser's native id.orig_h/id.resp_h
  # keys already do for Zeek. No such parser exists yet (Task 11 scope was
  # limited to this rules file); see the worklog for the follow-up.
  #
  # NOTE: unlike eCAR, eslogger records carry no top-level "hostname" field
  # (ESLoggerEmitter's envelope has none), so causal_pairs.yaml pairs below
  # cannot scope PID matches with `extra_match: hostname` — pidversion is
  # used instead where it disambiguates PID reuse.
  #
  # NOTE: `process.team_id` is intentionally NOT asserted "present" anywhere
  # below. Per config/activity/macos_signing.yaml, team_id is legitimately
  # null for Apple platform binaries, several third-party binaries (node,
  # npm), and storyline malware's unsigned/ad-hoc identity — null team_id is
  # documented, expected behavior for the large majority of exec events, not
  # a data-quality defect. Asserting presence would produce false failures.

  # --- Envelope (applies to every eslogger record) ---
  - name: "All eslogger records have envelope fields"
    condition: {}
    checks:
      - field: schema_version
        present: true
      - field: time
        present: true
      - field: mach_time
        present: true
      - field: seq_num
        present: true
      - field: global_seq_num
        present: true
      - field: event_type
        present: true
      - field: process.pid
        present: true
      - field: process.audit_token.pid
        present: true

  # --- exec (event_type 9) ---
  - name: "exec has argv"
    condition:
      event_type: 9
    checks:
      # `event.exec.args` is a list; the co-occurrence check DSL's
      # `min_length` only supports strings, so non-emptiness cannot be
      # asserted here — presence is the strongest available check.
      - field: event.exec.args
        present: true

  - name: "exec target has code-signing identity"
    condition:
      event_type: 9
    checks:
      - field: process.signing_id
        present: true
      - field: process.cdhash
        present: true
      - field: process.is_platform_binary
        present: true

  # --- fork (event_type 11) ---
  - name: "fork has child process identity"
    condition:
      event_type: 11
    checks:
      - field: event.fork.child.pid
        present: true
      - field: event.fork.child.audit_token.pidversion
        present: true

  # --- exit (event_type 15) ---
  - name: "exit has pid/pidversion"
    condition:
      event_type: 15
    checks:
      - field: process.pid
        present: true
      - field: process.audit_token.pidversion
        present: true

  # --- file events (create/open/write/rename/unlink) ---
  - name: "file create has destination path"
    condition:
      event_type: 13
    checks:
      - field: event.create.destination.path
        present: true

  - name: "file open has file path"
    condition:
      event_type: 10
    checks:
      - field: event.open.file.path
        present: true

  - name: "file write has target path"
    condition:
      event_type: 24
    checks:
      - field: event.write.target.path
        present: true

  - name: "file rename has source path"
    condition:
      event_type: 26
    checks:
      - field: event.rename.source.path
        present: true

  - name: "file unlink has target path"
    condition:
      event_type: 27
    checks:
      - field: event.unlink.target.path
        present: true

  # --- btm_launch_item_add (event_type 105) ---
  - name: "btm_launch_item_add has launch item identity"
    condition:
      event_type: 105
    checks:
      - field: event.btm_launch_item_add.item.url.path
        present: true
      - field: event.btm_launch_item_add.item.item_type
        present: true
      - field: event.btm_launch_item_add.executable_path
        present: true

  # --- session lifecycle (openssh_login/logout, lw_session lock/unlock) ---
  - name: "openssh_login has username and source address"
    condition:
      event_type: 106
    checks:
      - field: event.openssh_login.username
        present: true
      - field: event.openssh_login.source_address
        present: true

  - name: "openssh_logout has username and source address"
    condition:
      event_type: 107
    checks:
      - field: event.openssh_logout.username
        present: true
      - field: event.openssh_logout.source_address
        present: true

  - name: "lw_session_lock has username and graphical session id"
    condition:
      event_type: 108
    checks:
      - field: event.lw_session_lock.username
        present: true
      - field: event.lw_session_lock.graphical_session_id
        present: true

  - name: "lw_session_unlock has username and graphical session id"
    condition:
      event_type: 109
    checks:
      - field: event.lw_session_unlock.username
        present: true
      - field: event.lw_session_unlock.graphical_session_id
        present: true

  # --- privilege elevation (su/sudo) ---
  - name: "sudo has elevation subject/target"
    condition:
      event_type: 131
    checks:
      - field: event.sudo.from_username
        present: true
      - field: event.sudo.to_username
        present: true
      - field: event.sudo.success
        present: true

  - name: "su has elevation subject/target"
    condition:
      event_type: 130
    checks:
      - field: event.su.from_username
        present: true
      - field: event.su.to_username
        present: true
      - field: event.su.success
        present: true

syslog:
  - name: "Syslog has non-empty message"
    condition: {}
    checks:
      - field: message
        min_length: 1

  - name: "Syslog has hostname"
    condition: {}
    checks:
      - field: hostname
        not_equal: ""

snort_alert:
  - name: "Alert has valid priority"
    condition: {}
    checks:
      - field: priority
        min_value: 1
        max_value: 4

  - name: "Alert has source and destination"
    condition: {}
    checks:
      - field: src_ip
        present: true
      - field: dst_ip
        present: true

web_access:
  - name: "Request has valid status code"
    condition: {}
    checks:
      - field: status_code
        min_value: 100
        max_value: 599

  - name: "Request has HTTP method"
    condition: {}
    checks:
      - field: method
        in: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "PATCH"]

zeek_dns:
  - name: "DNS query has non-empty query field"
    condition: {}
    checks:
      - field: query
        min_length: 1

  - name: "DNS response has rcode"
    condition: {}
    checks:
      - field: rcode_name
        present: true

zeek_http:
  - name: "HTTP CONNECT must not have response body"
    condition:
      method: "CONNECT"
      status_code: 200
    checks:
      - field: response_body_len
        equals: 0

  - name: "HTTP response has method"
    condition: {}
    checks:
      - field: method
        in: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "PATCH", "CONNECT", "TRACE"]

bash_history:
  - name: "Command is non-empty"
    condition: {}
    checks:
      - field: command
        min_length: 1

  - name: "Has username"
    condition: {}
    checks:
      - field: username
        not_equal: ""
