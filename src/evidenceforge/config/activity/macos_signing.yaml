  - binary_path: "/sbin/launchd"
    category: "system"
    signing_id: "com.apple.xpc.launchd"
    team_id: null
    is_platform_binary: true
    codesigning_flags: ["CS_VALID", "CS_SIGNED", "CS_PLATFORM_BINARY", "CS_HARD", "CS_KILL", "CS_RESTRICT", "CS_ENFORCEMENT", "CS_REQUIRE_LV"]

