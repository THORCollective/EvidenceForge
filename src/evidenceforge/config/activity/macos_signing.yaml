  # ---------------------------------------------------------------------
  # Storyline malware — unsigned/ad-hoc by default. Illustrative entry for
  # AMOS/Atomic-Stealer-style trojanized, unnotarized installer payloads.
  # Any binary path not found in this table (the common case for malware
  # dropped under attacker-chosen paths) already falls back to the same
  # unsigned/ad-hoc `default` entry below, so most malware never needs an
  # explicit row here.
  #
  # IMPORTANT — AMOS/Atomic Stealer signing convention (read before building
  # the Task 12 three-hunt demo scenario):
  #
  # `/usr/bin/osascript` (see the system-binaries section above) is a real,
  # unmodified Apple platform binary and MUST stay `is_platform_binary: true`
  # / Apple-signed. Real AMOS samples never re-sign or replace osascript —
  # they invoke the genuine system binary (with a malicious AppleScript as
  # its argv, e.g. a fake system-password prompt) exactly like thousands of
  # benign AppleScript automations do. Flipping osascript's own table entry
  # to unsigned would falsely mark every benign osascript invocation in the
  # generated dataset as suspicious and destroy the hunt's precision as a
  # differentiator (everything would look like "the signal").
  #
  # The actual unsigned/ad-hoc identity in a real AMOS chain belongs to the
  # trojanized dropper app itself (commonly distributed as a fake "cracked"
  # installer, e.g. pirated CleanMyMac X / Photoshop / similar), which then:
  #   1. execs `/usr/bin/osascript` as a child to render the fake password
  #      prompt (osascript keeps its own real signed identity here),
  #   2. uses the harvested credential to read/exfiltrate
  #      `~/Library/Keychains/login.keychain-db` and other secrets itself
  #      (this file-open and any exfil activity is attributed to the
  #      dropper's own unsigned process — NOT to osascript).
  #
  # Task 12's AMOS storyline scenario MUST model the malicious payload
  # process using the binary_path below (or any other attacker-chosen path
  # — an unlisted path already falls to the unsigned/ad-hoc `default` at
  # the bottom of this file with zero YAML changes needed) as the process
  # that spawns osascript, opens the keychain file, and makes the egress
  # connection. It must NOT key unsigned identity off `osascript` itself.
  # ---------------------------------------------------------------------
  - binary_path: "/Applications/CleanMyMacX Helper.app/Contents/MacOS/CleanMyMacX Helper"
    category: "malware"
    signing_id: "CleanMyMacX Helper"
    team_id: null
    is_platform_binary: false
    codesigning_flags: ["CS_VALID", "CS_SIGNED", "CS_ADHOC"]

# Anything under these prefixes lives on the sealed, read-only system volume
# (SSV), so it can only be an Apple platform binary. Unlisted paths here get
# `platform_default`, with `{basename}` replaced by the executable name --
# e.g. /usr/libexec/foo -> com.apple.foo. /usr/local is NOT on the SSV.
platform_path_prefixes:
  - "/System/"
  - "/bin/"
  - "/sbin/"
  - "/usr/bin/"
  - "/usr/sbin/"
  - "/usr/libexec/"
  - "/usr/lib/"

platform_default:
  signing_id: "com.apple.{basename}"
  team_id: null
  is_platform_binary: true
  codesigning_flags: ["CS_VALID", "CS_SIGNED", "CS_PLATFORM_BINARY", "CS_HARD", "CS_KILL", "CS_RESTRICT", "CS_ENFORCEMENT", "CS_REQUIRE_LV"]

# Fallback identity for any other binary_path (unknown third-party code and
# storyline malware dropped under attacker-chosen paths). Apple Silicon will
# not execute unsigned arm64 code, so the realistic default is an ad-hoc,
# linker-signed binary: a signing identifier (the file name) and a CDHash, but
# no Team ID and no platform bit. That combination -- not an empty
# signing_id -- is what hunters pivot on.
default:
  signing_id: "{basename}"
  team_id: null
  is_platform_binary: false
  codesigning_flags: ["CS_VALID", "CS_SIGNED", "CS_ADHOC", "CS_LINKER_SIGNED"]
