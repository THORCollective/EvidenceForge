# macos_signing.yaml — macOS code-signing identity data for eslogger (Endpoint
# Security) process rendering.
#
# Purpose: Maps known macOS binaries — Apple platform binaries, third-party
#          apps, and storyline malware — to realistic code-signing identity
#          fields (signing_id, team_id, is_platform_binary, codesigning_flags)
#          for the eslogger emitter's process audit-token rendering.
#
# CDHash is intentionally NOT stored here. It is derived deterministically at
# lookup time by generation/activity/macos_signing.py (via _stable_seed,
# scoped by binary_path + team_id) so the same binary+team always yields the
# same CDHash across a run and across separate runs with the same seed,
# without duplicating a fake hash value in this file for every entry.
#
# binary_path is the full executable path as it appears on a `process` audit
# token / executable.path field. Paths for common Apple command-line tools
# and app-bundle executables follow documented macOS filesystem layout
# (Apple's own developer docs, `man` pages, and public `codesign -dv` output
# widely referenced in macOS security research). A handful of private
# framework daemon paths (mds, WindowServer, cloudd, bird) are illustrative/
# approximate since they were not verified against a live macOS system —
# their exact private-framework path is not load-bearing for synthetic
# training data, only a plausible macOS-shaped path is. Likewise, third-party
# vendor Team IDs for Google and Microsoft reflect commonly-cited real Apple
# Developer Team IDs; other vendors' Team IDs are plausible format-correct
# (10-character alphanumeric) placeholders rather than verified real values.
#
# Depended on by: eslogger emitter (Task 9, not yet landed) via
#                 get_signing_identity()
# Depends on: nothing — standalone
#
# Full schema: see docs/plans/2026-07-11-macos-eslogger-design.md

binaries:
  # ---------------------------------------------------------------------
  # System / Apple platform binaries — is_platform_binary: true, no team_id.
  # Apple's own platform binaries are signed with Apple's platform identity,
  # not a third-party Apple Developer Team ID.
