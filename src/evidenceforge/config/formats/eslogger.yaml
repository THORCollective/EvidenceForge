# eslogger format definition — macOS Endpoint Security (ESF) host telemetry
#
# Category: host
# Standalone: yes (no cross-file dependencies)
# Note: Rendered directly in Python by ESLoggerEmitter (json.dumps), not via the
#       Jinja2 template — the output.template below is a placeholder only, exactly
#       like ecar.yaml.  Records are nested (process.audit_token.*, event.<name>.*);
#       the `fields` list documents the schema using dotted field names.  The
#       FieldType enum has no object/array-of-object type, so nested container
#       nodes (process, event, process.audit_token, ...) are intentionally not
#       enumerated here — only their leaf scalars and list leaves are.
#
# Full schema: see docs/plans/2026-07-11-macos-eslogger-design.md

name: eslogger
version: "1.0"
description: "macOS Endpoint Security (eslogger) NDJSON host telemetry"
category: host

fields:
  # --- Envelope ---
  - name: schema_version
    type: integer
    required: true
    description: "ES message schema version"

  - name: time
    type: timestamp
    required: true
    description: "Wall-clock event time (ISO 8601 UTC, microseconds, Z suffix)"

  - name: mach_time
    type: integer
    required: true
    description: "Monotonic uptime-since-boot clock in nanoseconds"

  - name: seq_num
    type: integer
    required: true
    description: "Per-host (per-client) monotonic record sequence number"

  - name: global_seq_num
    type: integer
    required: true
    description: "Run-global monotonic record sequence number across all hosts"

  - name: event_type
    type: integer
    required: true
    description: "es_event_type_t integer (best-effort; event key name is authoritative)"

  # --- Acting process (audit token + code-signing identity) ---
  - name: process.pid
    type: integer
    required: true
    description: "Acting process PID"

  - name: process.ppid
    type: integer
    required: true
    description: "Acting process parent PID"

  - name: process.original_ppid
    type: integer
    required: false
    description: "Original parent PID at fork time"

  - name: process.session_id
    type: integer
    required: false
    description: "Audit session id (asid) the process belongs to"

  - name: process.executable.path
    type: string
    required: true
    description: "Full path to the process executable"

  - name: process.start_time
    type: string
    required: false
    description: "Process start time (ISO 8601 UTC)"

  - name: process.is_platform_binary
    type: boolean
    required: true
    description: "Whether the executable is an Apple platform binary"

  - name: process.signing_id
    type: string
    required: false
    description: "Code-signing identifier (e.g. com.apple.osascript)"

  - name: process.team_id
    type: string
    required: false
    description: "Apple Developer Team ID (null for platform binaries / unsigned)"

  - name: process.cdhash
    type: string
    required: false
    description: "Code directory hash (40 hex chars)"

  - name: process.codesigning_flags
    type: list
    required: false
    description: "CS_* code-signing flag names"

  # --- Acting process audit token ---
  - name: process.audit_token.pid
    type: integer
    required: true
    description: "Audit token PID"

  - name: process.audit_token.pidversion
    type: integer
    required: true
    description: "PID generation counter (disambiguates reused PIDs)"

  - name: process.audit_token.euid
    type: integer
    required: true
    description: "Effective user id"

  - name: process.audit_token.ruid
    type: integer
    required: true
    description: "Real user id"

  - name: process.audit_token.egid
    type: integer
    required: false
    description: "Effective group id"

  - name: process.audit_token.rgid
    type: integer
    required: false
    description: "Real group id"

  - name: process.audit_token.auid
    type: integer
    required: true
    description: "Audit user id (4294967295 when not a login session)"

  - name: process.audit_token.asid
    type: integer
    required: true
    description: "Audit session id"

  # --- Parent audit token ---
  - name: process.parent_audit_token.pid
    type: integer
    required: false
    description: "Parent audit token PID"

  - name: process.parent_audit_token.pidversion
    type: integer
    required: false
    description: "Parent PID generation counter"

  # --- Event payload leaves (per event_type; all optional at the envelope level) ---
  - name: event.exec.args
    type: list
    required: false
    description: "Full argv for exec events"

  - name: event.exec.cwd.path
    type: string
    required: false
    description: "Working directory for exec events"

  - name: event.openssh_login.username
    type: string
    required: false
    description: "Username for openssh_login events"

  - name: event.openssh_login.source_address
    type: string
    required: false
    description: "Source address for openssh_login events"

  - name: event.btm_launch_item_add.item.url.path
    type: string
    required: false
    description: "plist path for btm_launch_item_add events"

  - name: event.lw_session_lock.username
    type: string
    required: false
    description: "Locking user for lw_session_lock events"

  - name: event.lw_session_lock.graphical_session_id
    type: integer
    required: false
    description: "Graphical (audit) session id for lw_session lock/unlock events"

  - name: event.lw_session_unlock.username
    type: string
    required: false
    description: "Unlocking user for lw_session_unlock events"

  - name: event.sudo.success
    type: boolean
    required: false
    description: "Whether the sudo elevation succeeded"

  - name: event.sudo.from_username
    type: string
    required: false
    description: "Invoking user for sudo events"

  - name: event.sudo.to_username
    type: string
    required: false
    description: "Elevated target user for sudo events (root by default)"

  - name: event.sudo.command
    type: string
    required: false
    description: "Command run under sudo"

  - name: event.su.from_username
    type: string
    required: false
    description: "Invoking user for su events"

  - name: event.su.to_username
    type: string
    required: false
    description: "Elevated target user for su events (root by default)"

output:
  format: json
  file_extension: ".ndjson"
  encoding: utf-8
  # Template not used — ESLoggerEmitter builds NDJSON directly in Python.
  # Kept as an empty placeholder for format loader compatibility.
  template: "{}"
