# eslogger format definition — macOS Endpoint Security (ESF) host telemetry
#
# Category: host
# Standalone: yes (no cross-file dependencies)
# Note: Rendered directly in Python by ESLoggerEmitter (json.dumps), not via the
#       Jinja2 template — the output.template below is a placeholder only, exactly
#       like ecar.yaml.  Records are nested (process.audit_token.*, event.<name>.*);
#       the `fields` list documents the schema using dotted field names.  The
#       FieldType enum has no object/array-of-object type, so nested container
#       nodes (process, event, process.audit_token, ...) are intentionally not
#       enumerated here — only their leaf scalars and list leaves are.
#
# Full schema: see docs/plans/2026-07-11-macos-eslogger-design.md

name: eslogger
version: "2.0"
description: "macOS Endpoint Security (eslogger) NDJSON host telemetry"
category: host

fields:
  - name: schema_version
    type: integer
    required: true
    description: "eslogger JSON schema version"

  - name: version
    type: integer
    required: true
    description: "es_message_t version (6 = macOS 13, 7 = macOS 14, 8 = macOS 15)"

  - name: time
    type: timestamp
    required: true
    description: "Wall-clock event time (ISO 8601 UTC, nanoseconds, Z suffix)"

  - name: mach_time
    type: integer
    required: true
    description: "mach_absolute_time() at the event, in Apple Silicon 24 MHz ticks since boot"

  - name: thread.thread_id
    type: integer
    required: true
    description: "Mach thread id of the acting thread"

  - name: seq_num
    type: integer
    required: true
    description: "Per-host (per-client) monotonic record sequence number"

  - name: global_seq_num
    type: integer
    required: true
    description: "Run-global monotonic record sequence number across all hosts"

  - name: action_type
    type: integer
    required: true
    description: "es_action_type_t (1 = NOTIFY)"

  - name: action.result.result_type
    type: integer
    required: true
    description: "es_result_type_t of the notify result (0 = AUTH)"

  - name: event_type
    type: integer
    required: true
    description: "es_event_type_t from <EndpointSecurity/ESTypes.h>"

  - name: process.audit_token.pid
    type: integer
    required: true
    description: "Acting process PID (es_process_t has no top-level pid)"

  - name: process.audit_token.pidversion
    type: integer
    required: true
    description: "Acting process XNU pidversion (disambiguates reused PIDs)"

  - name: process.audit_token.euid
    type: integer
    required: true
    description: "Acting process effective uid"

  - name: process.audit_token.ruid
    type: integer
    required: true
    description: "Acting process real uid"

  - name: process.audit_token.egid
    type: integer
    required: true
    description: "Acting process effective gid"

  - name: process.audit_token.rgid
    type: integer
    required: true
    description: "Acting process real gid"

  - name: process.audit_token.auid
    type: integer
    required: true
    description: "Acting process audit user id (4294967295 when not in a login session)"

  - name: process.audit_token.asid
    type: integer
    required: true
    description: "Acting process audit session id"

  - name: process.ppid
    type: integer
    required: true
    description: "Acting process parent PID"

  - name: process.original_ppid
    type: integer
    required: true
    description: "Acting process original parent PID"

  - name: process.group_id
    type: integer
    required: true
    description: "Acting process process group id"

  - name: process.session_id
    type: integer
    required: true
    description: "Acting process session id"

  - name: process.codesigning_flags
    type: integer
    required: true
    description: "Acting process cs_blobs.h code-signing flags (uint32 bitmask)"

  - name: process.is_platform_binary
    type: boolean
    required: true
    description: "Acting process is an Apple platform binary"

  - name: process.is_es_client
    type: boolean
    required: true
    description: "Acting process is an Endpoint Security client"

  - name: process.cdhash
    type: string
    required: false
    description: "Acting process code directory hash (40 hex chars)"

  - name: process.signing_id
    type: string
    required: false
    description: "Acting process code-signing identifier"

  - name: process.team_id
    type: string
    required: false
    description: "Acting process Apple Developer Team ID (null for platform and ad-hoc code)"

  - name: process.executable.path
    type: string
    required: true
    description: "Acting process executable path (vnode-resolved)"

  - name: process.executable.path_truncated
    type: boolean
    required: true
    description: "Acting process executable path truncation flag"

  - name: process.tty.path
    type: string
    required: false
    description: "Acting process controlling terminal (null tty when none)"

  - name: process.start_time
    type: timestamp
    required: false
    description: "Acting process start time (ISO 8601 UTC, microseconds)"

  - name: process.responsible_audit_token.pid
    type: integer
    required: true
    description: "Acting process responsible process PID"

  - name: process.parent_audit_token.pid
    type: integer
    required: true
    description: "Acting process parent audit token PID"

  - name: process.parent_audit_token.pidversion
    type: integer
    required: true
    description: "Acting process parent pidversion"

  - name: event.exec.target.audit_token.pid
    type: integer
    required: false
    description: "Exec target (new image) PID (es_process_t has no top-level pid)"

  - name: event.exec.target.audit_token.pidversion
    type: integer
    required: false
    description: "Exec target (new image) XNU pidversion (disambiguates reused PIDs)"

  - name: event.exec.target.audit_token.euid
    type: integer
    required: false
    description: "Exec target (new image) effective uid"

  - name: event.exec.target.audit_token.ruid
    type: integer
    required: false
    description: "Exec target (new image) real uid"

  - name: event.exec.target.audit_token.egid
    type: integer
    required: false
    description: "Exec target (new image) effective gid"

  - name: event.exec.target.audit_token.rgid
    type: integer
    required: false
    description: "Exec target (new image) real gid"

  - name: event.exec.target.audit_token.auid
    type: integer
    required: false
    description: "Exec target (new image) audit user id (4294967295 when not in a login session)"

  - name: event.exec.target.audit_token.asid
    type: integer
    required: false
    description: "Exec target (new image) audit session id"

  - name: event.exec.target.ppid
    type: integer
    required: false
    description: "Exec target (new image) parent PID"

  - name: event.exec.target.original_ppid
    type: integer
    required: false
    description: "Exec target (new image) original parent PID"

  - name: event.exec.target.group_id
    type: integer
    required: false
    description: "Exec target (new image) process group id"

  - name: event.exec.target.session_id
    type: integer
    required: false
    description: "Exec target (new image) session id"

  - name: event.exec.target.codesigning_flags
    type: integer
    required: false
    description: "Exec target (new image) cs_blobs.h code-signing flags (uint32 bitmask)"

  - name: event.exec.target.is_platform_binary
    type: boolean
    required: false
    description: "Exec target (new image) is an Apple platform binary"

  - name: event.exec.target.is_es_client
    type: boolean
    required: false
    description: "Exec target (new image) is an Endpoint Security client"

  - name: event.exec.target.cdhash
    type: string
    required: false
    description: "Exec target (new image) code directory hash (40 hex chars)"

  - name: event.exec.target.signing_id
    type: string
    required: false
    description: "Exec target (new image) code-signing identifier"

  - name: event.exec.target.team_id
    type: string
    required: false
    description: "Exec target (new image) Apple Developer Team ID (null for platform and ad-hoc code)"

  - name: event.exec.target.executable.path
    type: string
    required: false
    description: "Exec target (new image) executable path (vnode-resolved)"

  - name: event.exec.target.executable.path_truncated
    type: boolean
    required: false
    description: "Exec target (new image) executable path truncation flag"

  - name: event.exec.target.tty.path
    type: string
    required: false
    description: "Exec target (new image) controlling terminal (null tty when none)"

  - name: event.exec.target.start_time
    type: timestamp
    required: false
    description: "Exec target (new image) start time (ISO 8601 UTC, microseconds)"

  - name: event.exec.target.responsible_audit_token.pid
    type: integer
    required: false
    description: "Exec target (new image) responsible process PID"

  - name: event.exec.target.parent_audit_token.pid
    type: integer
    required: false
    description: "Exec target (new image) parent audit token PID"

  - name: event.exec.target.parent_audit_token.pidversion
    type: integer
    required: false
    description: "Exec target (new image) parent pidversion"

  - name: event.exec.args
    type: list
    required: false
    description: "Full argv for exec events"

  - name: event.exec.cwd.path
    type: string
    required: false
    description: "Working directory for exec events"

  - name: event.exec.dyld_exec_path
    type: string
    required: false
    description: "Path dyld was asked to execute"

  - name: event.exec.last_fd
    type: integer
    required: false
    description: "Highest open file descriptor at exec"

  - name: event.exec.image_cputype
    type: integer
    required: false
    description: "Mach-O CPU type of the exec'd image"

  - name: event.exec.image_cpusubtype
    type: integer
    required: false
    description: "Mach-O CPU subtype of the exec'd image"

  - name: event.fork.child.audit_token.pid
    type: integer
    required: false
    description: "Forked child PID (still running the parent image)"

  - name: event.fork.child.audit_token.pidversion
    type: integer
    required: false
    description: "Forked child pre-exec pidversion"

  - name: event.fork.child.executable.path
    type: string
    required: false
    description: "Forked child image (the parent's image until exec)"

  - name: event.exit.stat
    type: integer
    required: false
    description: "Exit status"

  - name: event.create.destination_type
    type: integer
    required: false
    description: "es_destination_type_t (0 = EXISTING_FILE for notify create)"

  - name: event.create.destination.existing_file.path
    type: string
    required: false
    description: "Created file path"

  - name: event.open.fflag
    type: integer
    required: false
    description: "open(2) fflag bits (FREAD=1, FWRITE=2)"

  - name: event.open.file.path
    type: string
    required: false
    description: "Opened file path"

  - name: event.write.target.path
    type: string
    required: false
    description: "Written file path"

  - name: event.rename.source.path
    type: string
    required: false
    description: "Renamed file source path"

  - name: event.rename.destination_type
    type: integer
    required: false
    description: "es_destination_type_t for the rename destination"

  - name: event.rename.destination.new_path.filename
    type: string
    required: false
    description: "Rename destination file name"

  - name: event.unlink.target.path
    type: string
    required: false
    description: "Unlinked file path"

  - name: event.unlink.parent_dir.path
    type: string
    required: false
    description: "Unlinked file's parent directory"

  - name: event.openssh_login.success
    type: boolean
    required: false
    description: "Whether the SSH login succeeded"

  - name: event.openssh_login.result_type
    type: integer
    required: false
    description: "es_openssh_login_result_type_t (2 = AUTH_SUCCESS)"

  - name: event.openssh_login.source_address_type
    type: integer
    required: false
    description: "es_address_type_t (1 = IPv4, 2 = IPv6)"

  - name: event.openssh_login.source_address
    type: string
    required: false
    description: "SSH client address"

  - name: event.openssh_login.username
    type: string
    required: false
    description: "SSH login username"

  - name: event.openssh_login.has_uid
    type: boolean
    required: false
    description: "Whether uid is populated"

  - name: event.openssh_login.uid.uid
    type: integer
    required: false
    description: "SSH login uid"

  - name: event.openssh_logout.source_address_type
    type: integer
    required: false
    description: "es_address_type_t (1 = IPv4, 2 = IPv6)"

  - name: event.openssh_logout.source_address
    type: string
    required: false
    description: "SSH client address"

  - name: event.openssh_logout.username
    type: string
    required: false
    description: "SSH logout username"

  - name: event.openssh_logout.uid
    type: integer
    required: false
    description: "SSH logout uid"

  - name: event.btm_launch_item_add.item.item_type
    type: integer
    required: false
    description: "es_btm_item_type_t (3 = agent, 4 = daemon)"

  - name: event.btm_launch_item_add.item.legacy
    type: boolean
    required: false
    description: "True for legacy launchd plists"

  - name: event.btm_launch_item_add.item.managed
    type: boolean
    required: false
    description: "True when managed by MDM"

  - name: event.btm_launch_item_add.item.uid
    type: integer
    required: false
    description: "User id the item runs for"

  - name: event.btm_launch_item_add.item.item_url
    type: string
    required: false
    description: "file:// URL of the launch item plist"

  - name: event.btm_launch_item_add.executable_path
    type: string
    required: false
    description: "Program path from the launchd plist"

  - name: event.btm_launch_item_add.instigator.audit_token.pid
    type: integer
    required: false
    description: "Process that instigated the BTM add (when known)"

  - name: event.btm_launch_item_add.instigator.executable.path
    type: string
    required: false
    description: "Instigating process image"

  - name: event.btm_launch_item_add.instigator.signing_id
    type: string
    required: false
    description: "Instigating process signing identifier"

  - name: event.lw_session_lock.username
    type: string
    required: false
    description: "User for lw_session_lock events"

  - name: event.lw_session_lock.graphical_session_id
    type: integer
    required: false
    description: "Graphical (audit) session id for lw_session_lock events"

  - name: event.lw_session_unlock.username
    type: string
    required: false
    description: "User for lw_session_unlock events"

  - name: event.lw_session_unlock.graphical_session_id
    type: integer
    required: false
    description: "Graphical (audit) session id for lw_session_unlock events"

  - name: event.sudo.success
    type: boolean
    required: false
    description: "Whether the elevation succeeded"

  - name: event.sudo.has_from_uid
    type: boolean
    required: false
    description: "Whether from_uid is populated"

  - name: event.sudo.from_uid.uid
    type: integer
    required: false
    description: "Invoking user's uid"

  - name: event.sudo.from_username
    type: string
    required: false
    description: "Invoking user"

  - name: event.sudo.has_to_uid
    type: boolean
    required: false
    description: "Whether to_uid is populated"

  - name: event.sudo.to_uid.uid
    type: integer
    required: false
    description: "Target user's uid"

  - name: event.sudo.to_username
    type: string
    required: false
    description: "Target user"

  - name: event.sudo.command
    type: string
    required: false
    description: "Command run under sudo"

  - name: event.su.success
    type: boolean
    required: false
    description: "Whether the elevation succeeded"

  - name: event.su.from_uid
    type: integer
    required: false
    description: "Invoking user's uid"

  - name: event.su.from_username
    type: string
    required: false
    description: "Invoking user"

  - name: event.su.has_to_uid
    type: boolean
    required: false
    description: "Whether to_uid is populated"

  - name: event.su.to_uid.uid
    type: integer
    required: false
    description: "Target user's uid"

  - name: event.su.to_username
    type: string
    required: false
    description: "Target user"

  - name: event.su.shell
    type: string
    required: false
    description: "Shell launched by su"

  - name: event.su.argc
    type: integer
    required: false
    description: "su argument count"

  - name: event.su.argv
    type: list
    required: false
    description: "su argv"

output:
  format: json
  file_extension: ".ndjson"
  encoding: utf-8
  # Template not used — ESLoggerEmitter builds NDJSON directly in Python.
  # Kept as an empty placeholder for format loader compatibility.
  template: "{}"
