# OBTS macOS hunt searches. Every search runs over all time (the demo data is dated 2024-06-11).
# Field names come from props.conf [macos:eslogger]; raw nested ES paths are noted where useful.

[default]
dispatch.earliest_time = 0
dispatch.latest_time = now
is_scheduled = 0
disabled = 0

# ---------------------------------------------------------------------------
# Orientation
# ---------------------------------------------------------------------------
[OBTS 00 - ES event mix per Mac]
description = What each Mac's eslogger stream contains, by ES event type.
search = index=macos sourcetype=macos:eslogger \
| chart count over host_short by es_event

[OBTS 01 - Stack non-Apple code that executed]
description = Long-tail stack of every non-platform binary that exec'd, with its signing class. Ad-hoc signed code with no Team ID is the outlier class.
search = index=macos sourcetype=macos:eslogger es_event=exec target_signer!=apple \
| stats count dc(host_short) AS hosts values(host_short) AS on values(process_name) AS launched_by by target_signer target_team_id target_path \
| sort target_signer count

# ---------------------------------------------------------------------------
# Hunt 1 - AMOS / Atomic Stealer (MAC-DESIGN-01)
# ---------------------------------------------------------------------------
[OBTS AMOS 1 - Ad-hoc signed app bundle launched by launchd]
description = launchd exec'ing a non-platform, ad-hoc signed binary with no Team ID (a double-clicked unnotarized app). Raw fields: event.exec.target.team_id / is_platform_binary / codesigning_flags (CS_ADHOC = 0x2).
search = index=macos sourcetype=macos:eslogger es_event=exec process_path="/sbin/launchd" target_signer=adhoc target_team_id=none \
| table _time host_short uid target_pid target_path target_signing_id target_team_id cmdline

[OBTS AMOS 1b - Ad-hoc launchd jobs by install location and prevalence]
description = Refine AMOS 1 past Homebrew: ad-hoc launchd jobs stacked by where the binary lives and how many Macs run it. An app bundle in /Applications or a binary in /Users/Shared with no Team ID on one Mac stands out; /opt/homebrew services are expected on developer Macs.
search = index=macos sourcetype=macos:eslogger es_event=exec process_path="/sbin/launchd" target_signer=adhoc \
| eval location=case(match(target_path, "^/opt/homebrew/"), "homebrew", match(target_path, "^/Applications/.+\.app/"), "app bundle", match(target_path, "^/Users/Shared/"), "/Users/Shared", true(), "other") \
| stats count dc(host_short) AS macs values(host_short) AS on values(cmdline) AS cmdline by location target_path \
| sort macs location

[OBTS AMOS 2 - Non-Apple parent spawns osascript]
description = Signed /usr/bin/osascript exec'd from a non-platform parent image, with the fake password dialog visible in argv.
search = index=macos sourcetype=macos:eslogger es_event=exec target_path="/usr/bin/osascript" process_platform=false \
| table _time host_short ppid process_path process_signer target_pid cmdline

[OBTS AMOS 3 - Keychain opened by non-Apple code]
description = A non-platform process opening a user's login keychain database.
search = index=macos sourcetype=macos:eslogger es_event=open file_path="*/Library/Keychains/*" process_platform=false \
| table _time host_short pid process_path process_signer process_team_id file_path

[OBTS AMOS 3b - Keychain opened by code with no Team ID]
description = Refine AMOS 3 past browsers: Chrome reads its Safe Storage key with a Developer ID (Team EQHXZ8M8AV); a keychain reader with no Team ID is the lead.
search = index=macos sourcetype=macos:eslogger es_event=open file_path="*/Library/Keychains/*" process_platform=false \
| stats count values(host_short) AS on by process_path process_signer process_team_id \
| eval lead=if(process_team_id=="none", "investigate", "known vendor")

[OBTS AMOS 4 - Keychain reader egress in Zeek]
description = ES has no network events: pivot from each no-Team-ID keychain read (host -> IP via mac_hosts lookup) to that host's external Zeek conn/ssl from 30 s before to 2 minutes after the open. Windows are per open, so a browser's earlier keychain read on the same Mac doesn't shift them.
search = index=macos sourcetype=macos:eslogger es_event=open file_path="*/Library/Keychains/*" process_platform=false process_team_id=none \
| eval src_ip=host_ip, keychain_time=_time, keychain_reader=process_path \
| fields src_ip keychain_time keychain_reader \
| append [ search index=zeek (sourcetype=bro:conn:json OR sourcetype=bro:ssl:json) NOT id.resp_h=10.* NOT id.resp_p=53 | eval src_ip='id.orig_h' ] \
| eventstats values(keychain_time) AS keychain_times values(keychain_reader) AS keychain_reader by src_ip \
| where isnotnull(uid) AND isnotnull(keychain_times) \
| eval keychain_time=mvindex(mvmap(keychain_times, if(_time - keychain_times >= -30 AND _time - keychain_times <= 120, keychain_times, null())), 0) \
| where isnotnull(keychain_time) \
| stats min(_time) AS first_seen values(server_name) AS sni sum(orig_bytes) AS bytes_out sum(resp_bytes) AS bytes_in values(keychain_reader) AS keychain_reader min(keychain_time) AS keychain_time by uid src_ip id.resp_h id.resp_p \
| eval seconds_after_keychain=round(first_seen-keychain_time, 3), first_seen=strftime(first_seen, "%F %T.%3N") \
| table first_seen seconds_after_keychain src_ip id.resp_h id.resp_p sni bytes_out bytes_in uid keychain_reader

[OBTS AMOS 5 - Full AMOS chain on one host]
description = Single timeline for the dropper pid: exec, osascript child, keychain open, exit.
search = index=macos sourcetype=macos:eslogger host_short=MAC-DESIGN-01 \
    [ search index=macos sourcetype=macos:eslogger es_event=exec process_path="/sbin/launchd" target_signer=adhoc \
      | stats values(target_pid) AS p | eval search="(pid IN (" . mvjoin(p, ",") . ") OR ppid IN (" . mvjoin(p, ",") . "))" | fields search ] \
| table _time es_event pid ppid process_path target_path cmdline file_path

# ---------------------------------------------------------------------------
# Hunt 2 - DPRK BeaverTail (MAC-DEV-01)
# ---------------------------------------------------------------------------
[OBTS BeaverTail 1 - Package-manager lifecycle shells]
description = node (npm) exec'ing a shell: every npm install lifecycle script shows up here. node is legitimately Developer ID signed, so the chain, not the signature, is the signal.
search = index=macos sourcetype=macos:eslogger es_event=exec process_name=node target_path IN ("/bin/sh", "/bin/bash", "/bin/zsh") \
| table _time host_short ppid target_pid cmdline cwd

[OBTS BeaverTail 2 - node -> sh -c -> node chain]
description = Reassemble npm -> sh -c -> node postinstall by pid/ppid across exec records.
search = index=macos sourcetype=macos:eslogger es_event=exec process_path="/bin/sh" target_name=node \
| rename ppid AS sh_pid, cmdline AS child_cmd, target_pid AS child_pid \
| join type=inner host sh_pid \
    [ search index=macos sourcetype=macos:eslogger es_event=exec process_name=node target_path="/bin/sh" \
      | rename target_pid AS sh_pid, cmdline AS sh_cmd, ppid AS npm_pid | fields host sh_pid sh_cmd npm_pid ] \
| join type=left host npm_pid \
    [ search index=macos sourcetype=macos:eslogger es_event=exec target_name=node \
      | rename target_pid AS npm_pid, cmdline AS npm_cmd | fields host npm_pid npm_cmd ] \
| table _time host_short host_ip npm_pid npm_cmd sh_pid sh_cmd child_pid child_cmd cwd

[OBTS BeaverTail 3 - postinstall beacon in Zeek]
description = From each postinstall node start, pivot to that host's external DNS + TLS in the next 2 minutes.
search = index=macos sourcetype=macos:eslogger es_event=exec process_path="/bin/sh" target_name=node cmdline="*postinstall*" \
| eval src_ip=host_ip, postinstall_time=_time, postinstall=cmdline \
| fields src_ip postinstall_time postinstall \
| append [ search index=zeek ((sourcetype=bro:dns:json NOT query="*.test") OR (sourcetype=bro:conn:json NOT id.resp_h=10.* NOT id.resp_p=53) OR sourcetype=bro:ssl:json) | eval src_ip='id.orig_h' ] \
| eventstats min(postinstall_time) AS postinstall_time values(postinstall) AS postinstall by src_ip \
| where isnotnull(uid) AND _time>=postinstall_time AND _time<=postinstall_time+120 \
| eval seconds_after=round(_time-postinstall_time, 3) \
| table _time seconds_after sourcetype src_ip query answers id.resp_h id.resp_p server_name orig_bytes resp_bytes uid postinstall \
| sort _time

[OBTS BeaverTail 3b - Where every lifecycle-script node went]
description = Refine BeaverTail past node-gyp: every node started by an npm `sh -c` lifecycle script, with the external names its host resolved in the next 15 seconds. nodejs.org headers are expected for native modules; a fresh lookalike domain is not.
search = index=macos sourcetype=macos:eslogger es_event=exec process_path="/bin/sh" target_name=node \
| eval src_ip=host_ip, script_time=_time, script=cmdline \
| fields src_ip script_time script host_short \
| append [ search index=zeek sourcetype=bro:dns:json NOT query="*.test" NOT query="*.arpa" | eval src_ip='id.orig_h' ] \
| eventstats values(host_short) AS mac values(script_time) AS script_times by src_ip \
| where isnotnull(query) AND isnotnull(script_times) \
| eval script_time=mvindex(mvmap(script_times, if(_time - script_times >= 0 AND _time - script_times <= 15, script_times, null())), 0) \
| where isnotnull(script_time) \
| stats min(_time) AS first_lookup values(answers) AS answers by mac script_time query \
| eval script_time=strftime(script_time, "%F %T.%3N") \
| eval first_lookup=strftime(first_lookup, "%F %T.%3N")

# ---------------------------------------------------------------------------
# Hunt 3 - CloudMensis-style LaunchAgent persistence (MAC-IT-01)
# ---------------------------------------------------------------------------
[OBTS CloudMensis 1 - Plist created in a user LaunchAgents dir]
description = File create under ~/Library/LaunchAgents, with the writer's signing class.
search = index=macos sourcetype=macos:eslogger es_event=create file_path="/Users/*/Library/LaunchAgents/*.plist" \
| table _time host_short pid process_path process_signer process_team_id file_path

[OBTS CloudMensis 2 - BTM launch item added]
description = btm_launch_item_add is reported by backgroundtaskmanagementd; the process that wrote the item is the instigator.
search = index=macos sourcetype=macos:eslogger es_event=btm_launch_item_add \
| table _time host_short process_path btm_item_type btm_item_url btm_executable_path btm_instigator_pid btm_instigator_path btm_instigator_signing_id

[OBTS CloudMensis 3 - Plist create joined to BTM instigator]
description = Tie the LaunchAgent write to the BTM registration by host + instigator pid, and flag com.apple.* names written by non-Apple code.
search = index=macos sourcetype=macos:eslogger ((es_event=create file_path="*/Library/LaunchAgents/*") OR es_event=btm_launch_item_add) \
| eval writer_pid=coalesce(btm_instigator_pid, pid), writer_path=coalesce(btm_instigator_path, process_path) \
| eval plist=coalesce(file_path, urldecode(replace(btm_item_url, "^file://", ""))), writer_signer=if(es_event=="create", process_signer, null()) \
| stats min(_time) AS first max(_time) AS last values(es_event) AS es_events values(btm_executable_path) AS runs values(writer_signer) AS writer_signer by host_short writer_pid writer_path plist \
| eval masquerade=if(match(plist, "/com\.apple\.[^/]+\.plist$") AND NOT match(writer_path, "^/(System|usr|sbin|bin)/"), "yes", "no") \
| eval first=strftime(first, "%F %T.%3N"), last=strftime(last, "%F %T.%3N")

# ---------------------------------------------------------------------------
# IT admin SSH (MAC-IT-01 -> MAC-DEV-01)
# ---------------------------------------------------------------------------
[OBTS SSH 1 - openssh login/logout sessions]
description = Pair ES openssh_login and openssh_logout into sessions.
search = index=macos sourcetype=macos:eslogger es_event IN (openssh_login, openssh_logout) \
| transaction host ssh_user ssh_src startswith=eval(es_event="openssh_login") endswith=eval(es_event="openssh_logout") \
| table _time host_short ssh_user ssh_src ssh_success duration eventcount

[OBTS SSH 2 - SSH sessions in Zeek alongside ES]
description = The same session from the network side: Zeek conn to the Mac on 22/tcp.
search = index=zeek sourcetype=bro:conn:json id.resp_p=22 \
| lookup mac_hosts host_ip AS id.resp_h OUTPUT host_short AS dest_mac \
| lookup mac_hosts host_ip AS id.orig_h OUTPUT host_short AS src_mac \
| table _time src_mac id.orig_h dest_mac id.resp_h duration conn_state orig_bytes resp_bytes uid
