[default]
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 3650

# ---------------------------------------------------------------------------
# macOS Endpoint Security (eslogger --format json), one es_message_t per line.
# Raw nested fields stay available (e.g. 'event.exec.target.executable.path');
# the flat aliases below are what the hunt searches use.
# ---------------------------------------------------------------------------
[macos:eslogger]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
KV_MODE = json
TZ = UTC
# Top-level `time` precedes every nested *start_time, so the first match is the envelope time.
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9NZ
MAX_TIMESTAMP_LOOKAHEAD = 40

LOOKUP-es_event = es_event_types event_type OUTPUT es_event
LOOKUP-mac_host = mac_hosts host OUTPUT host_short host_ip owner

# Subject process (for exec: the pre-exec image, i.e. the parent program).
# *_signer: apple = platform binary; adhoc = CS_ADHOC (0x2) set in codesigning_flags
# (arithmetic, since bitand() returned nothing on Splunk 10.2); developer_id = has a Team ID.
EVAL-pid = 'process.audit_token.pid'
EVAL-ppid = 'process.ppid'
EVAL-uid = 'process.audit_token.euid'
EVAL-process_path = 'process.executable.path'
EVAL-process_name = mvindex(split('process.executable.path', "/"), -1)
EVAL-process_signing_id = 'process.signing_id'
EVAL-process_team_id = if(isnull('process.team_id') OR 'process.team_id'="null", "none", 'process.team_id')
EVAL-process_platform = 'process.is_platform_binary'
EVAL-process_signer = case('process.is_platform_binary'="true", "apple", floor('process.codesigning_flags' / 2) % 2 == 1, "adhoc", isnotnull('process.team_id') AND 'process.team_id'!="null", "developer_id", true(), "other")

# exec: the launched program.
EVAL-target_pid = 'event.exec.target.audit_token.pid'
EVAL-target_path = 'event.exec.target.executable.path'
EVAL-target_name = mvindex(split('event.exec.target.executable.path', "/"), -1)
EVAL-target_signing_id = 'event.exec.target.signing_id'
EVAL-target_team_id = if(isnull('event.exec.target.executable.path'), null(), if(isnull('event.exec.target.team_id') OR 'event.exec.target.team_id'="null", "none", 'event.exec.target.team_id'))
EVAL-target_platform = 'event.exec.target.is_platform_binary'
EVAL-target_signer = if(isnull('event.exec.target.executable.path'), null(), case('event.exec.target.is_platform_binary'="true", "apple", floor('event.exec.target.codesigning_flags' / 2) % 2 == 1, "adhoc", isnotnull('event.exec.target.team_id') AND 'event.exec.target.team_id'!="null", "developer_id", true(), "other"))
EVAL-cmdline = mvjoin('event.exec.args{}', " ")
EVAL-cwd = 'event.exec.cwd.path'

# fork: the child pid.
EVAL-child_pid = 'event.fork.child.audit_token.pid'

# File events.
EVAL-file_path = coalesce('event.open.file.path', 'event.create.destination.existing_file.path', 'event.create.destination.new_path.dir.path' . "/" . 'event.create.destination.new_path.filename', 'event.write.target.path', 'event.close.target.path', 'event.unlink.target.path', 'event.rename.source.path')

# Background Task Management: reported by backgroundtaskmanagementd; the writer is `instigator`.
EVAL-btm_item_url = 'event.btm_launch_item_add.item.item_url'
EVAL-btm_item_type = 'event.btm_launch_item_add.item.item_type'
EVAL-btm_executable_path = 'event.btm_launch_item_add.executable_path'
EVAL-btm_instigator_pid = 'event.btm_launch_item_add.instigator.audit_token.pid'
EVAL-btm_instigator_path = 'event.btm_launch_item_add.instigator.executable.path'
EVAL-btm_instigator_signing_id = 'event.btm_launch_item_add.instigator.signing_id'

# OpenSSH login/logout.
EVAL-ssh_src = coalesce('event.openssh_login.source_address', 'event.openssh_logout.source_address')
EVAL-ssh_user = coalesce('event.openssh_login.username', 'event.openssh_logout.username')
EVAL-ssh_success = 'event.openssh_login.success'

# ---------------------------------------------------------------------------
# Zeek JSON (same stanzas as EvidenceForge's Splunk parser harness).
# ---------------------------------------------------------------------------
[bro:conn:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = "ts"\s*:\s*
TIME_FORMAT = %s.%Q
MAX_TIMESTAMP_LOOKAHEAD = 24
FIELDALIAS-zeek_src = id.orig_h AS src_ip id.orig_p AS src_port
FIELDALIAS-zeek_dest = id.resp_h AS dest_ip id.resp_p AS dest_port

