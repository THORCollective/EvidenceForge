# eslogger has no hostname field: the host is the per-Mac directory name (segment 2 of
# /eforge-data/<fqdn>/eslogger.ndjson).
[monitor:///eforge-data/*/eslogger.ndjson]
index = macos
sourcetype = macos:eslogger
host_segment = 2
crcSalt = <SOURCE>
disabled = false

[monitor:///eforge-data/zeek-core/conn.json]
