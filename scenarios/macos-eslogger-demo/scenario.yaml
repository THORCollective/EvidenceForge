version: "1.0"
name: macos-eslogger-demo
description: |
  Three macOS threat-hunt beats rendered as authentic Endpoint Security (ESF)
  telemetry via the `eslogger` emitter, with Zeek network telemetry for
  cross-source egress correlation. This is the reference hunt-loop artifact for
  the OBTS macOS Endpoint Security talk.

  Three real-world-modeled hunts run on three macOS workstations:
    1. AMOS / Atomic Stealer  — a trojanized "CleanMyMac X" installer payload
       (unsigned/ad-hoc) execs signed /usr/bin/osascript to show a fake password
       prompt, reads ~/Library/Keychains/login.keychain-db, and exfiltrates over
       TLS. The dropper's unsigned code-signing identity + keychain access +
       egress are the signal; osascript stays legitimately Apple-signed.
    2. DPRK BeaverTail        — `npm install` of a malicious package whose
       postinstall script launches `node`, which beacons to attacker
       infrastructure (correlated in Zeek conn/dns).
    3. CloudMensis persistence — an unsigned helper drops a LaunchAgent plist
       under ~/Library/LaunchAgents; the BTM (Background Task Management)
       launch-item-add event is produced automatically by the causal engine.

  Six Macs share one office, so each hunt stacks against a population. The
  red_herrings are benign lookalikes a hunter has to rule out (Homebrew's
  ad-hoc-signed services and LaunchAgent, Chrome reading the keychain, a
  node-gyp postinstall that downloads headers).

  See README.md for the per-hunt evidence and self-verification recipe.

environment:
  description: "Small design/engineering shop: six macOS workstations and an internal resolver behind a monitored egress"
  domain: "clearwater-studio.test"

  users:
    - username: dana.reyes
      full_name: "Dana Reyes"
      email: "dana.reyes@clearwater-studio.test"
      persona: marketing
      primary_system: MAC-DESIGN-01
      enabled: true
    - username: sam.okafor
      full_name: "Sam Okafor"
      email: "sam.okafor@clearwater-studio.test"
      persona: developer
      primary_system: MAC-DEV-01
      enabled: true
    - username: riley.chen
      full_name: "Riley Chen"
      email: "riley.chen@clearwater-studio.test"
      persona: sysadmin
      primary_system: MAC-IT-01
      enabled: true
    - username: jordan.lee
      full_name: "Jordan Lee"
      email: "jordan.lee@clearwater-studio.test"
      persona: developer
      primary_system: MAC-DEV-02
      enabled: true
    - username: priya.nair
      full_name: "Priya Nair"
      email: "priya.nair@clearwater-studio.test"
      persona: sales
      primary_system: MAC-SALES-01
      enabled: true
    - username: alex.kim
      full_name: "Alex Kim"
      email: "alex.kim@clearwater-studio.test"
      persona: project_manager
      primary_system: MAC-PM-01
      enabled: true

  systems:
    - hostname: MAC-DESIGN-01
      ip: "10.20.10.31"
      os: "macOS 14.5"
      type: workstation
      assigned_user: dana.reyes
    - hostname: MAC-DEV-01
      ip: "10.20.10.32"
      os: "macOS 14.5"
      type: workstation
      assigned_user: sam.okafor
      services: ["ssh"]
    - hostname: MAC-IT-01
      ip: "10.20.10.33"
      os: "macOS 14.5"
      type: workstation
      assigned_user: riley.chen
      services: ["ssh"]
    - hostname: MAC-DEV-02
      ip: "10.20.10.34"
      os: "macOS 14.5"
      type: workstation
      assigned_user: jordan.lee
    - hostname: MAC-SALES-01
      ip: "10.20.10.35"
      os: "macOS 14.5"
      type: workstation
      assigned_user: priya.nair
    - hostname: MAC-PM-01
      ip: "10.20.10.36"
      os: "macOS 14.5"
      type: workstation
      assigned_user: alex.kim
    # Internal recursive resolver: the Macs resolve through it, so internal names
    # never leave the office and Zeek sees each client's lookups on the LAN.
    - hostname: NS-01
      ip: "10.20.1.10"
      os: "Ubuntu 22.04"
      type: server
      roles: [dns_server]

  # A core SPAN sensor so Zeek records the macOS hosts' egress. The eslogger
  # emitter deliberately renders no network events (ESF has no TCP-connect
  # event), so BeaverTail's `node` beacon and AMOS's exfil POST are hunted by
  # correlating ES `exec` with the Zeek conn/dns rows for the same host.
  network:
    segments:
      - name: mac-workstations
        cidr: "10.20.10.0/24"
        description: "macOS workstation segment"
        exposure: both
        external_ratio: 0.5
        systems: [MAC-DESIGN-01, MAC-DEV-01, MAC-IT-01, MAC-DEV-02, MAC-SALES-01, MAC-PM-01]
      - name: servers
        cidr: "10.20.1.0/24"
        description: "Office infrastructure"
        exposure: both
        systems: [NS-01]
    sensors:
      - type: network
        name: core-span
        hostname: ZEEK-CORE
        monitoring_segments: [mac-workstations, servers]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
        description: "Core switch SPAN for macOS egress visibility"

time_window:
  start: "2024-06-11T14:00:00Z"
  duration: "2h"

baseline_activity:
  description: "Business-day macOS activity (app launches, zsh, browsing, daemons) so each hunt has a population to stand out from"
  intensity: high
  variation: medium

output:
  logs:
    - format: eslogger
    - format: zeek
  destination: "./output"
  compression: false

storyline:
  # --- Hunt 1: AMOS / Atomic Stealer -------------------------------------------
  # The trojanized "CleanMyMac X" installer payload is the ad-hoc signed dropper
  # (no Team ID; see the macos_signing.yaml AMOS convention). In the order real
  # AMOS runs: it execs the genuine, Apple-signed /usr/bin/osascript to phish
  # the login password with a fake system dialog, then reads the login keychain
  # and exfiltrates over TLS itself. process_ref pins the keychain read and the
  # upload to the dropper, so the signed osascript child never owns them.
  - id: amos-infection
    time: "+22m"
    actor: dana.reyes
    system: MAC-DESIGN-01
    activity: "AMOS/Atomic Stealer: fake CleanMyMac X installer phishes the login password via osascript, then harvests the login keychain and exfiltrates over TLS"
    events:
      - type: process
        technique: "T1204.002 - User Execution: Malicious File"
        description: "Trojanized, unnotarized CleanMyMac X installer payload (ad-hoc signed, no Team ID) launches"
        process_name: "/Applications/CleanMyMacX Helper.app/Contents/MacOS/CleanMyMacX Helper"
        command_line: "/Applications/CleanMyMacX\\ Helper.app/Contents/MacOS/CleanMyMacX\\ Helper"
        process_ref: amos_dropper
      - type: process
        technique: "T1056.002 - Input Capture: GUI Input Capture"
        description: "Dropper execs the genuine Apple-signed osascript to render a fake system-password dialog"
        process_name: "/usr/bin/osascript"
        command_line: "osascript -e \"display dialog \\\"macOS needs your password to update system settings.\\\" default answer \\\"\\\" with hidden answer with icon caution\""
        parent_ref: amos_dropper
      - type: file
        technique: "T1555.001 - Credentials from Password Stores: Keychain"
        description: "Dropper opens the user login keychain to harvest stored secrets"
        path: "/Users/dana.reyes/Library/Keychains/login.keychain-db"
        action: open
        process_ref: amos_dropper
      - type: connection
        technique: "T1041 - Exfiltration Over C2 Channel"
        description: "Dropper exfiltrates the harvested keychain + browser data over TLS to the stealer panel"
        dst_ip: "193.42.33.14"
        dst_port: 443
        hostname: "gateway.macos-analytics.top"
        service: ssl
        orig_bytes: 2450000
        resp_bytes: 640
        process_ref: amos_dropper

  # --- Hunt 2: DPRK BeaverTail --------------------------------------------------
  # A developer runs `npm install` of an attacker-controlled package in their
  # webapp checkout. npm is a `#!/usr/bin/env node` script, so ES sees an exec
  # of node with the npm script in argv. npm runs the package's postinstall
  # lifecycle script through `sh -c` from the package directory; that node
  # process beacons to attacker infrastructure.
  - id: beavertail-npm-postinstall
    time: "+51m"
    actor: sam.okafor
    system: MAC-DEV-01
    activity: "DPRK BeaverTail: npm install of a malicious package runs a postinstall script that launches node, which beacons to attacker infrastructure"
    events:
      - type: process
        technique: "T1195.001 - Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
        description: "Developer installs a trojanized npm package (npm runs as a node script)"
        process_name: "/usr/local/bin/node"
        command_line: "node /usr/local/bin/npm install @clearwater-ui/react-icons-pro"
        working_directory: "/Users/sam.okafor/dev/webapp"
        process_ref: npm_install
      - type: process
        technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
        description: "npm runs the package's postinstall lifecycle script through sh"
        process_name: "/bin/sh"
        command_line: "sh -c \"node scripts/postinstall.js\""
        working_directory: "/Users/sam.okafor/dev/webapp/node_modules/@clearwater-ui/react-icons-pro"
        parent_ref: npm_install
        process_ref: npm_lifecycle
      - type: process
        technique: "T1059.007 - Command and Scripting Interpreter: JavaScript"
        description: "Malicious postinstall runs the BeaverTail stage-1 loader in node"
        process_name: "/usr/local/bin/node"
        command_line: "node scripts/postinstall.js"
        working_directory: "/Users/sam.okafor/dev/webapp/node_modules/@clearwater-ui/react-icons-pro"
        parent_ref: npm_lifecycle
        process_ref: beavertail_loader
      - type: connection
        technique: "T1071.001 - Application Layer Protocol: Web Protocols"
        description: "node stage-1 loader beacons to attacker infrastructure to pull the stage-2 payload"
        dst_ip: "45.128.199.72"
        dst_port: 443
        hostname: "api.ipcheck-beaver.cc"
        service: ssl
        orig_bytes: 1800
        resp_bytes: 96000
        process_ref: beavertail_loader

  # --- Hunt 3: CloudMensis-style persistence -----------------------------------
  # An ad-hoc signed helper drops a LaunchAgent plist. Do NOT declare the BTM event
  # here: the causal engine emits btm_launch_item_add automatically because the
  # file `create` lands under LaunchAgents.
  - id: cloudmensis-persistence
    time: "+86m"
    actor: riley.chen
    system: MAC-IT-01
    activity: "CloudMensis-style persistence: an ad-hoc signed helper writes a masquerading LaunchAgent plist (BTM launch-item-add follows automatically)"
    events:
      - type: process
        technique: "T1543.001 - Create or Modify System Process: Launch Agent"
        description: "Ad-hoc signed persistence helper (no Team ID) stages itself under /Users/Shared"
        process_name: "/Users/Shared/.cloudsync/cloudsyncd"
        command_line: "/Users/Shared/.cloudsync/cloudsyncd --install"
        process_ref: cloudmensis_helper
      - type: file
        technique: "T1543.001 - Create or Modify System Process: Launch Agent"
        description: "Helper drops a LaunchAgent plist masquerading as an Apple iCloud sync daemon (drives the BTM causal rule)"
        path: "/Users/riley.chen/Library/LaunchAgents/com.apple.cloudsyncd.plist"
        action: create
        launch_program: "/Users/Shared/.cloudsync/cloudsyncd"
        process_ref: cloudmensis_helper

  # --- Supporting: legitimate admin SSH (exercises openssh_login + openssh_logout) --
  # A complete SSH session lifecycle: login on the macOS destination (rendered as
  # an ES `openssh_login`) followed by an explicit logoff (rendered as
  # `openssh_logout`) so the pair is observable end-to-end.
  - id: it-admin-ssh-login
    time: "+95m"
    actor: riley.chen
    system: MAC-DEV-01
    activity: "IT admin SSHes to the developer workstation for routine maintenance"
    events:
      - type: ssh_session
        technique: "T1021.004 - Remote Services: SSH"
        description: "Benign remote admin session (baseline-style operational activity)"
        source_ip: "10.20.10.33"
  - id: it-admin-ssh-logoff
    time: "+104m"
    actor: riley.chen
    system: MAC-DEV-01
    activity: "IT admin closes the SSH maintenance session"
    events:
      - type: logoff
        description: "SSH session close (renders as ES openssh_logout on the macOS host)"

# Benign lookalikes: each one matches a naive version of a hunt query, so the
# hunter has to refine it (see README.md "Refining past the red herrings").
red_herrings:
  # Homebrew bottles are ad-hoc linker-signed with no Team ID, launched by launchd,
  # and `brew services` writes a user LaunchAgent (BTM follows): the same shape
  # as CloudMensis, without the com.apple.* masquerade or the /Users/Shared stage.
  - id: rh-brew-services-postgres
    time: "+38m"
    actor: jordan.lee
    system: MAC-DEV-02
    activity: "Developer starts a Homebrew PostgreSQL service"
    explanation: "brew services writes homebrew.mxcl.postgresql@16.plist and launchd starts the ad-hoc signed postgres bottle; normal developer tooling"
    events:
      - type: process
        process_name: "/opt/homebrew/Library/Homebrew/vendor/portable-ruby/3.3.4/bin/ruby"
        command_line: "/opt/homebrew/Library/Homebrew/vendor/portable-ruby/3.3.4/bin/ruby -W1 --disable=gems,rubyopt /opt/homebrew/Library/Homebrew/brew.rb services start postgresql@16"
        working_directory: "/Users/jordan.lee/dev/api"
        process_ref: brew_ruby
      - type: file
        path: "/Users/jordan.lee/Library/LaunchAgents/homebrew.mxcl.postgresql@16.plist"
        action: create
        launch_program: "/opt/homebrew/opt/postgresql@16/bin/postgres"
        process_ref: brew_ruby
      - type: process
        process_name: "/bin/launchctl"
        command_line: "/bin/launchctl bootstrap gui/511 /Users/jordan.lee/Library/LaunchAgents/homebrew.mxcl.postgresql@16.plist"
        parent_ref: brew_ruby
      - type: process
        process_name: "/opt/homebrew/opt/postgresql@16/bin/postgres"
        command_line: "/opt/homebrew/opt/postgresql@16/bin/postgres -D /opt/homebrew/var/postgresql@16"

  # Browsers read the login keychain for their Safe Storage key: a non-platform
  # keychain open, but Developer ID signed with a known Team ID.
  - id: rh-chrome-keychain-design
    time: "+9m"
    actor: dana.reyes
    system: MAC-DESIGN-01
    activity: "Chrome reads its Safe Storage key from the login keychain"
    explanation: "Chrome (Developer ID, Team EQHXZ8M8AV) opens login.keychain-db at startup to decrypt saved passwords and cookies"
    events:
      - type: process
        process_name: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        command_line: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        process_ref: chrome_design
      - type: file
        path: "/Users/dana.reyes/Library/Keychains/login.keychain-db"
        action: open
        process_ref: chrome_design
  - id: rh-chrome-keychain-sales
    time: "+57m"
    actor: priya.nair
    system: MAC-SALES-01
    activity: "Chrome reads its Safe Storage key from the login keychain"
    explanation: "Chrome (Developer ID, Team EQHXZ8M8AV) opens login.keychain-db at startup to decrypt saved passwords and cookies"
    events:
      - type: process
        process_name: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        command_line: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        process_ref: chrome_sales
      - type: file
        path: "/Users/priya.nair/Library/Keychains/login.keychain-db"
        action: open
        process_ref: chrome_sales

  # A native npm module builds in its install script and downloads Node headers:
  # the same node -> sh -c -> node chain as BeaverTail, going to nodejs.org.
  - id: rh-npm-node-gyp
    time: "+64m"
    actor: jordan.lee
    system: MAC-DEV-02
    activity: "npm install of a native module runs node-gyp, which downloads Node headers"
    explanation: "bcrypt's install script runs node-gyp rebuild, which fetches the Node.js headers tarball from nodejs.org; normal for native modules"
    events:
      - type: process
        process_name: "/usr/local/bin/node"
        command_line: "node /usr/local/bin/npm install bcrypt"
        working_directory: "/Users/jordan.lee/dev/api"
        process_ref: gyp_npm
      - type: process
        process_name: "/bin/sh"
        command_line: "sh -c \"node-gyp rebuild\""
        working_directory: "/Users/jordan.lee/dev/api/node_modules/bcrypt"
        parent_ref: gyp_npm
        process_ref: gyp_sh
      - type: process
        process_name: "/usr/local/bin/node"
        command_line: "node /usr/local/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js rebuild"
        working_directory: "/Users/jordan.lee/dev/api/node_modules/bcrypt"
        parent_ref: gyp_sh
        process_ref: gyp_node
      - type: connection
        dst_ip: "104.20.23.46"
        dst_port: 443
        hostname: "nodejs.org"
        service: ssl
        orig_bytes: 2100
        resp_bytes: 8650000
        process_ref: gyp_node
